<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meu perfil-Sobra Zero">
  <title>Meu perfil-Sobra Zero</title>
  <link rel="stylesheet" href="../css/stily.css">
</head>
<body>
  <header class="site-header" id="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../design/Logo/Logo.svg" alt="Logo Sobra Zero">
        <span><strong>Sobra Zero</strong><small>Squad Lilás</small></span>
      </a>
      <nav class="nav">
        <a href="ofertas.html">Ofertas</a>
        <a href="publicar-oferta.html">Publicar</a>
        <a href="relatorio.html">Relatório</a>
        <a href="perfil.html" aria-current="page">Perfil</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-ghost" id="btn-sair" type="button">Sair</button>
      </div>
    </div>
  </header>

  <main class="container page-shell page-shell--narrow">
    <div class="page-head">
      <span class="kicker">Conta · dados do cadastro</span>
      <h1>Meu perfil</h1>
      <p class="sub" id="perfil-resumo">Carregando seus dados…</p>
    </div>

    <div class="card">
      <form id="form-perfil" class="form-grid" novalidate>

        <section class="form-section">
          <div class="form-section-head">
            <span data-icon="user-round" data-size="18"></span>
            <div>
              <h3>Conta</h3>
              <p>Dados básicos de identificação e contato.</p>
            </div>
          </div>

          <div class="field">
            <label for="p-tipo">Tipo de conta</label>
            <input id="p-tipo" type="text" disabled value="—">
          </div>

          <div class="form-row">
            <div class="field">
              <label for="p-nome">Nome de exibição</label>
              <input id="p-nome" type="text" minlength="2" required placeholder="Seu nome">
            </div>
            <div class="field">
              <label for="p-tel">Telefone</label>
              <input id="p-tel" type="tel" placeholder="(11) 90000-0000">
            </div>
          </div>

          <div class="field">
            <label for="p-email">E-mail (somente leitura)</label>
            <input id="p-email" type="email" disabled value="—">
          </div>
        </section>

        <section class="form-section">
          <div class="form-section-head">
            <span data-icon="building-2" data-size="18"></span>
            <div>
              <h3>Dados do vínculo</h3>
              <p>Informações específicas do seu papel na plataforma.</p>
            </div>
          </div>

          <!-- Seção específica por perfil, preenchida via JS -->
          <div id="perfil-detalhe" class="form-grid"></div>
        </section>

        <p id="perfil-erro" class="alert alert-warn" style="display:none; margin:0"></p>

        <div class="form-actions">
          <button class="btn btn-ghost" id="btn-recarregar" type="button">
            <span data-icon="clock" data-size="16"></span> Recarregar
          </button>
          <button class="btn btn-primary" id="btn-salvar" type="submit">
            <span data-icon="check-check" data-size="16"></span> Salvar alterações
          </button>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { logout } from '../pages-js/supabase.js';
    document.getElementById('btn-sair')?.addEventListener('click', logout);
  </script>
  <script type="module" src="../pages-js/icons.js"></script>
  <script type="module" src="../pages-js/perfil.js"></script>
</body>
</html>
