<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acompanhar oferta-Sobra Zero">
  <title>Oferta-Sobra Zero</title>
  <link rel="stylesheet" href="../css/stily.css">
</head>
<body>
  <header class="site-header" id="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../design/Logo/Logo.svg" alt="Logo Sobra Zero">
        <span><strong>Sobra Zero</strong><small>Squad Lilás</small></span>
      </a>
      <nav class="nav">
        <a href="ofertas.html">Ofertas</a>
        <a href="publicar-oferta.html">Publicar</a>
        <a href="relatorio.html">Relatório</a>
        <a href="perfil.html">Perfil</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-ghost" id="btn-sair" type="button">Sair</button>
      </div>
    </div>
  </header>

  <main class="container page-shell page-shell--narrow">
    <a href="ofertas.html" class="back-link">← Voltar ao feed</a>
    <div class="page-head">
      <span class="kicker">Telas 06/07/08 · Ciclo: publicada → aceita → coletada → entregue → confirmada</span>
    </div>

    <div id="oferta-resumo" class="oferta-resumo">
      <div class="card">
        <p style="color:var(--muted); margin:0">Carregando detalhes da oferta...</p>
      </div>
    </div>

    <section class="card" style="margin-top:1rem" aria-labelledby="titulo-timeline">
      <h3 id="titulo-timeline">Linha do tempo</h3>
      <div id="timeline-oferta">
        <p style="color:var(--muted); margin:0">Carregando timeline...</p>
      </div>
    </section>

    <section class="card" style="margin-top:1rem" aria-labelledby="titulo-acoes">
      <h3 id="titulo-acoes">Ações</h3>
      <div id="acoes-oferta" class="acoes-oferta">
        <p style="color:var(--muted); margin:0">Carregando ações...</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { logout } from '../pages-js/supabase.js';
    document.getElementById('btn-sair')?.addEventListener('click', logout);
  </script>
  <script type="module" src="../pages-js/oferta.js"></script>
</body>
</html>
