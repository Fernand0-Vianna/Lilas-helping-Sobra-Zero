<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ofertas disponíveis — Sobra Zero">
  <title>Ofertas disponíveis — Sobra Zero</title>
  <link rel="stylesheet" href="../css/stily.css">
  <style>
    /* Box de detalhes do card — guia de estilo §7 (tokens §1) */
    .detalhe-box {
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      padding: 6px 16px;
      margin-bottom: 16px;
      background: #fff;
    }
    .detalhe-linha {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #E5E7EB;
      align-items: baseline;
    }
    .detalhe-linha:last-child { border-bottom: 0; }
    .detalhe-linha span { font-size: 12px; font-weight: 600; color: #6B7280; }
    .detalhe-linha p { font-size: 14px; margin: 0; color: #111827; }
    /* Alerta de cadeia de frio — guia §6 (alert-rn02) */
    .alert-rn02 {
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #E5E7EB;
      border-left: 4px solid #D97706;
      background: #FFFBEB;
    }
    .alert-rn02 strong { display: block; font-size: 14px; margin-bottom: 6px; color: #92400E; }
    .alert-rn02 p { font-size: 14px; color: #6B7280; margin: 0; }
  </style>
</head>
<body>
  <header class="site-header" id="header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../design/Logo/Logo.svg" alt="Logo Sobra Zero">
        <span><strong>Sobra Zero</strong><small>Squad Lilás</small></span>
      </a>
      <nav class="nav">
        <a href="ofertas.html">Ofertas</a>
        <a href="publicar-oferta.html">Publicar</a>
        <a href="relatorio.html">Relatório</a>
        <a href="perfil.html">Perfil</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-ghost" id="btn-sair" type="button">Sair</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding:2rem 1rem 4rem; max-width:1100px">
    <span class="kicker">Tela 05 / M2 · Feed com equidade (RN-06)</span>
    <h1>Ofertas disponíveis</h1>
    <p class="sub">Ordenadas por equidade: quem recebeu menos kg nos últimos 30 dias aparece primeiro.</p>

    <div class="card" style="display:flex; gap:.75rem; flex-wrap:wrap; align-items:end; margin:1.5rem 0">
      <div class="field" style="min-width:200px">
        <label for="filtro-tipo">Tipo de alimento</label>
        <select id="filtro-tipo">
          <option value="">Todos</option>
          <option value="preparado">Preparado (RN-01 · 4h+2h)</option>
          <option value="nao_perecivel">Não perecível</option>
          <option value="frio">Frio (exige frio)</option>
          <option value="congelado">Congelado (RN-08 · 48h)</option>
        </select>
      </div>
      <div class="field" style="min-width:180px">
        <label for="filtro-frio">Cadeia de frio</label>
        <select id="filtro-frio">
          <option value="">Todos</option>
          <option value="true">Exige frio</option>
          <option value="false">Não exige frio</option>
        </select>
      </div>
      <button class="btn btn-ghost" id="limpar-filtros" type="button">Limpar filtros</button>
      <a class="btn btn-primary" href="publicar-oferta.html" style="margin-left:auto">+ Publicar oferta</a>
    </div>

    <div id="feed-ofertas" class="feed-container" style="display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(280px,1fr))"></div>
  </main>

  <script type="module">
    import { logout } from '../pages-js/supabase.js';
    document.getElementById('btn-sair')?.addEventListener('click', logout);
  </script>
  <script type="module" src="../pages-js/ofertas.js"></script>
</body>
</html>
